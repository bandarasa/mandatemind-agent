[project]
name = "mandatemind-agent"
version = "0.1.0"
description = "MandateMind Tenant-Side Evidence Collection Agent"
authors = [
    { name = "MandateMind", email = "support@mandatemind.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "croniter>=1.3.15",
    "ldap3>=2.9",
    "pywin32; platform_system=='Windows'",
]

[project.scripts]
mandatemind-agent = "mm_agent.main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
