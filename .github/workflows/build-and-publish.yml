name: Publish MandateMind Agent

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # REMOVE requirements.txt step — it does not exist

      - name: Build Linux agent
        run: |
          mkdir -p dist/linux
          tar -czvf dist/linux/mandatemind-agent-linux-x64.tar.gz mm_agent/

      - name: Build Windows MSI
        run: |
          mkdir -p dist/windows
          powershell -File installer/build.ps1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 sync dist/ s3://mandatemind-downloads/agent/latest/

      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v2
        with:
          distribution-id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          paths: "/*"
