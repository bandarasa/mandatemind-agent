name: Publish MandateMind Agent

on:
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux agent
        run: |
          mkdir -p dist/linux
          tar -czvf dist/linux/mandatemind-agent-linux-x64.tar.gz mm_agent/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload Linux artifact to S3
        run: |
          aws s3 sync dist/linux/ s3://mandatemind-downloads/agent/latest/

  build-windows:
    runs-on: windows-latest
    needs: build-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset --version=3.11.2 -y

      - name: Build Windows MSI
        run: |
          mkdir dist
          powershell -File installer/windows/build_msi.ps1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload Windows artifact to S3
        run: |
          aws s3 sync dist/ s3://mandatemind-downloads/agent/latest/


  invalidate:
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
